paper: paper-01-representation
manifest_version: 3
status: draft

validation:
  id: VALIDATION
  requirements:
    - id: V1
      name: structural-traceability
      criterion: Interpreted objects remain exactly traceable through composition and serialization.
    - id: V2
      name: invariance
      criterion: Permitted relabellings produce equivalent Abstract Graphs and identical signatures.
  notebook: ../analysis/notebooks/validation.ipynb

research_questions:
  - id: RQ1
    short_name: structural-discrimination
    question: How does operator choice and composition change preserved, collapsed, and accessible distinctions?
    claims: [P1-C2, P1-C3, P1-C4, P1-C5]
    notebook: ../analysis/notebooks/RQ1-structural-discrimination.ipynb
  - id: RQ2
    short_name: discrimination-complexity
    question: What computational cost is required for the distinctions exposed by each expression?
    claims: [P1-C5]
    notebook: ../analysis/notebooks/RQ2-discrimination-complexity.ipynb

experiment_families:
  - id: E00-validation
    track: VALIDATION
    dataset_ids: [SYN-PERM-01]
    configs: [configs/roundtrip.yaml, configs/permutation.yaml]
    status: specified
  - id: E01-discrimination
    research_questions: [RQ1]
    dataset_ids: [SYN-CPS-01]
    configs: [configs/expressiveness.yaml, configs/accessibility.yaml, configs/collisions.yaml]
    status: specified
  - id: E02-tradeoff
    research_questions: [RQ2]
    dataset_ids: [SYN-CPS-01, SYN-SCALE-01]
    configs: [configs/scaling.yaml]
    status: specified

required_run_metadata:
  - track
  - experiment_id
  - run_id
  - code_revision
  - dirty_worktree
  - environment
  - dataset_version
  - split_id
  - config_paths
  - config_digests
  - random_seeds
  - hardware
  - started_at
  - duration_seconds
  - peak_memory_bytes
  - status

artifact_contract:
  raw_data: ../results/{experiment_id}/{run_id}/data
  run_metadata: ../results/{experiment_id}/{run_id}/run.json
  tables: ../tables/generated/{track}/{run_id}
  figures: ../figures/generated/{track}/{run_id}
  notebook_record: ../results/{experiment_id}/{run_id}/executed-notebook.ipynb
