paper: paper-01-representation
manifest_version: 3
status: draft

research_questions:
  - id: RQ1
    short_name: kernel-coverage-composition
    question: Which established graph-kernel feature maps are faithful AG programs, bounded proxies, or not currently native, and what higher-order features can composition define?
    claims: [P1-C2, P1-C3, P1-C4, P1-C6, P1-C7]
    notebook: ../analysis/notebooks/RQ1-structural-discrimination.ipynb
  - id: RQ2
    short_name: discrimination-complexity
    question: What does each factor-specific discrimination gain cost relative to atomic, concatenated, and flat-materialized controls?
    claims: [P1-C5]
    notebook: ../analysis/notebooks/RQ2-discrimination-complexity.ipynb

experiment_families:
  - id: E01-discrimination
    research_questions: [RQ1]
    dataset_ids: [SYN-CPS-01, ZINC-250K-01]
    configs: [configs/expressiveness.yaml, configs/accessibility.yaml, configs/collisions.yaml]
    status: specified
  - id: E02-tradeoff
    research_questions: [RQ2]
    dataset_ids: [SYN-CPS-01, SYN-SCALE-01, ZINC-250K-01]
    configs: [configs/scaling.yaml]
    status: specified

required_run_metadata:
  - track
  - experiment_id
  - run_id
  - code_revision
  - dirty_worktree
  - environment
  - dataset_version
  - split_id
  - config_paths
  - config_digests
  - random_seeds
  - hardware
  - started_at
  - duration_seconds
  - peak_memory_bytes
  - status

artifact_contract:
  raw_data: ../results/{experiment_id}/{run_id}/data
  run_metadata: ../results/{experiment_id}/{run_id}/run.json
  tables: ../tables/generated/{track}/{run_id}
  figures: ../figures/generated/{track}/{run_id}
  notebook_record: ../results/{experiment_id}/{run_id}/executed-notebook.ipynb
